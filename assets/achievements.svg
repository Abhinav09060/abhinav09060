<svg xmlns="http://www.w3.org/2000/svg" width="900" height="275" viewBox="0 0 900 275" role="img" aria-label="Achievements"><title>Achievements</title><rect x="1" y="1" width="898" height="273" rx="20" fill="#fbfcff" stroke="#ece6d3" stroke-width="2"/><rect x="30" y="30" width="150" height="95" rx="16" fill="#fdbb2d"/><text x="105" y="77" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="#1a1a1a">Top 20</text><text x="105" y="102" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a">of 200 teams</text><text x="210" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#1a1a1a">Webathon 2.0</text><text x="210" y="88" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#6b6b6b">Built a document summariser in 24 hours with Python, Streamlit</text><text x="210" y="112" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#6b6b6b">and the Gemini API that turns uploaded PDFs into study flashcards.</text><rect x="30" y="145" width="150" height="95" rx="16" fill="#fdbb2d"/><text x="105" y="192" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="#1a1a1a">Top 15</text><text x="105" y="217" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a">of 105 teams</text><text x="210" y="175" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#1a1a1a">Event-booking platform hackathon</text><text x="210" y="203" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#6b6b6b">Full-stack booking platform with a Java and Spring Boot backend,</text><text x="210" y="227" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#6b6b6b">with optimised MySQL queries for simultaneous bookings under time limits.</text></svg>