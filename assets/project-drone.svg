<svg xmlns="http://www.w3.org/2000/svg" width="900" height="185" viewBox="0 0 900 185" role="img" aria-label="Gesture-Controlled Drone"><title>Gesture-Controlled Drone</title><rect x="1" y="1" width="898" height="183" rx="20" fill="#fbfcff" stroke="#ece6d3" stroke-width="2"/><rect x="1" y="26" width="8" height="140" rx="4" fill="#fdbb2d"/><text x="40" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#1a1a1a">Gesture-Controlled Drone</text><text x="860" y="52" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#fdbb2d" font-weight="700">01</text><text x="40" y="86" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#6b6b6b">Hand gestures tracked with MediaPipe steer a drone,</text><text x="40" y="110" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#6b6b6b">sending commands to an ESP32 over WiFi using UDP.</text><rect x="40" y="130" width="75" height="30" rx="15" fill="#fff6dc" stroke="#fdbb2d"/><text x="78" y="150" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a">Python</text><rect x="125" y="130" width="100" height="30" rx="15" fill="#fff6dc" stroke="#fdbb2d"/><text x="175" y="150" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a">MediaPipe</text><rect x="235" y="130" width="67" height="30" rx="15" fill="#fff6dc" stroke="#fdbb2d"/><text x="268" y="150" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a">ESP32</text><rect x="312" y="130" width="51" height="30" rx="15" fill="#fff6dc" stroke="#fdbb2d"/><text x="337" y="150" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a">UDP</text></svg>