<svg xmlns="http://www.w3.org/2000/svg" width="900" height="178" viewBox="0 0 900 178" role="img" aria-labelledby="title desc">
  <title id="title">AI Resume Analyzer</title>
  <desc id="desc">An AI-powered resume analysis app that finds skill gaps and missing keywords against job descriptions.</desc>
  <rect x="1" y="1" width="898" height="176" rx="18" fill="#10090d" stroke="#54202e" stroke-width="2"/>
  <rect x="1" y="22" width="5" height="134" rx="2.5" fill="#e5132b"/>
  <text x="31" y="42" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#ff5369">AI  ·  NLP  ·  2025</text>
  <text x="31" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="700" fill="#f8f0f3">AI Resume Analyzer</text>
  <text x="31" y="109" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#bd9da6">Compares resumes with job descriptions to reveal skill gaps, missing keywords,</text>
  <text x="31" y="132" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#bd9da6">and actionable feedback for ATS-friendly applications.</text>
  <rect x="31" y="145" width="83" height="22" rx="11" fill="#291019"/><text x="72" y="160" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#ff8997">PYTHON</text>
  <rect x="122" y="145" width="93" height="22" rx="11" fill="#291019"/><text x="168" y="160" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#ff8997">STREAMLIT</text>
  <rect x="223" y="145" width="65" height="22" rx="11" fill="#291019"/><text x="255" y="160" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#ff8997">NLP</text>
  <circle cx="824" cy="82" r="44" fill="#1b0b12" stroke="#e5132b" stroke-opacity=".65" stroke-width="2"/>
  <path d="M804 62h26l14 14v29h-40z" fill="none" stroke="#ff5369" stroke-width="3" stroke-linejoin="round"/>
  <path d="M830 62v15h14M812 86h22M812 94h22" fill="none" stroke="#ff5369" stroke-width="2" stroke-linecap="round"/>
